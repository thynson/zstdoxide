name: Rust codec
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-10-08
          components: rustfmt, clippy
      - run: sh scripts/check.sh
  upstream-oracles:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-10-08
      - name: Build pinned external test oracles
        run: |
          reference="$RUNNER_TEMP/zstd-v1.5.7"
          git clone --quiet --depth 1 --branch v1.5.7 https://github.com/facebook/zstd.git "$reference"
          test "$(git -C "$reference" rev-parse HEAD)" = f8745da6ff1ad1e7bab384bd1f9d742439278e99
          make -C "$reference/lib" -j2 libzstd.a
          make -C "$reference/programs" -j2 ZSTD_LEGACY_SUPPORT=4 zstd
          make -C "$reference/tests" -j2 decodecorpus
      - name: Regenerate fixtures and run independent compatibility checks
        env:
          ZSTDOXIDE_FUZZ_CYCLES: "30000"
          ZSTDOXIDE_FUZZ_SEED: "305419896"
        run: ZSTD_UPSTREAM="$RUNNER_TEMP/zstd-v1.5.7" sh scripts/check_upstream_oracles.sh
  miri:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-10-08
          components: miri, rust-src
      - run: python3 scripts/check_miri_filter.py --lib --all-features history::tests
      - run: python3 scripts/check_miri_filter.py --lib --all-features ring_history::tests
      - run: python3 scripts/check_miri_filter.py --lib --all-features stream_decode::tests
      - run: python3 scripts/check_miri_filter.py --test upstream_streaming --all-features exact_history_overwrite_regression_survives_output_fragmentation
      - run: python3 scripts/check_miri_filter.py --test upstream_streaming --all-features exact_small_sequence_sections_survive_every_chunk_boundary
      - run: python3 scripts/check_miri_filter.py --lib --all-features bitstream::tests
      - run: python3 scripts/check_miri_filter.py --lib --all-features fse::tests
      - run: python3 scripts/check_miri_filter.py --lib --all-features cursor::tests
      - run: python3 scripts/check_miri_filter.py --lib --all-features matchfinder::tests
      - run: python3 scripts/check_miri_filter.py --lib --all-features huffman::tests::mixed_lengths_decode_short_final_code
      - run: python3 scripts/check_miri_filter.py --lib --all-features bitwriter::tests
      - run: python3 scripts/check_miri_filter.py --lib --all-features encode::tests::inverse_entropy_transitions_recover_every_successor
      - run: python3 scripts/check_miri_filter.py --lib --all-features fse_encode::tests::lookup_bounds_reject_extreme_indices_without_reading_absent_rows -- --exact
      - run: python3 scripts/check_miri_filter.py --lib --all-features huffman_codebook::tests::sparse_codebooks_reject_absent_symbols_and_cover_the_extreme_indices -- --exact
      - run: python3 scripts/check_miri_filter.py --lib --all-features matchchain::tests::checked_accessors_cover_extreme_indices_and_reject_invalid_writes -- --exact
      - run: python3 scripts/check_miri_filter.py --lib --all-features matchchain::tests::cyclic_slot_reuse_rejects_stale_heads_and_older_links -- --exact
      - run: python3 scripts/check_miri_filter.py --lib --all-features match_parse::tests::lazy_delayed_overlap_inserts_every_start_once_at_full_width_coordinates -- --exact
